<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Algorithm Activity</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --panel: #ffffff;
      --text: #1f2328;
      --muted: #636c76;
      --border: #d0d7de;
      --shadow: 0 12px 32px rgb(31 35 40 / 12%);
      --level-0: #ebedf0;
      --level-1: #fff4b8;
      --level-2: #ffe66d;
      --level-3: #f6c945;
      --level-4: #d4a600;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0d1117;
        --panel: #161b22;
        --text: #e6edf3;
        --muted: #8b949e;
        --border: #30363d;
        --shadow: 0 12px 32px rgb(0 0 0 / 35%);
        --level-0: #30363d;
        --level-1: #5f5100;
        --level-2: #927a00;
        --level-3: #c49a00;
        --level-4: #e3b341;
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 860px);
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 5vw, 34px);
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 8px 0 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      overflow: hidden;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .chart-scroll {
      overflow-x: auto;
      padding: 4px 2px 14px;
    }

    #chart {
      display: grid;
      grid-template-columns: 32px repeat(53, 11px);
      grid-template-rows: 18px repeat(7, 11px);
      gap: 3px;
      width: max-content;
      min-width: 100%;
    }

    .month,
    .weekday {
      color: var(--muted);
      font-size: 10px;
      line-height: 11px;
      white-space: nowrap;
    }

    .month { align-self: start; }
    .weekday { align-self: center; }

    .day {
      width: 11px;
      height: 11px;
      padding: 0;
      border: 0;
      border-radius: 2px;
      background: var(--level-0);
      cursor: pointer;
    }

    .day[data-level="1"] { background: var(--level-1); }
    .day[data-level="2"] { background: var(--level-2); }
    .day[data-level="3"] { background: var(--level-3); }
    .day[data-level="4"] { background: var(--level-4); }
    .day.future { opacity: 0.45; }
    .day:hover,
    .day:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }

    .legend {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .legend-cell {
      width: 11px;
      height: 11px;
      border-radius: 2px;
      background: var(--level-0);
    }

    .legend-cell[data-level="1"] { background: var(--level-1); }
    .legend-cell[data-level="2"] { background: var(--level-2); }
    .legend-cell[data-level="3"] { background: var(--level-3); }
    .legend-cell[data-level="4"] { background: var(--level-4); }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .stat { text-align: center; }
    .stat + .stat { border-left: 1px solid var(--border); }
    .stat-label { color: var(--muted); font-size: 12px; }
    .stat-value { margin-top: 5px; font-size: 20px; font-weight: 650; }

    #tooltip {
      position: fixed;
      z-index: 10;
      max-width: calc(100vw - 24px);
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--text);
      color: var(--background);
      box-shadow: var(--shadow);
      font-size: 12px;
      line-height: 1.4;
      pointer-events: none;
      transform: translate(-50%, calc(-100% - 9px));
      white-space: nowrap;
    }

    #tooltip[hidden] { display: none; }

    .error {
      padding: 36px 12px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 560px) {
      body { padding: 28px 12px; }
      .card { padding: 18px 14px; }
      .stats { grid-template-columns: 1fr; gap: 14px; }
      .stat + .stat { padding-top: 14px; border-top: 1px solid var(--border); border-left: 0; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Algorithm Activity</h1>
    <p class="subtitle">잔디에 마우스를 올리거나 탭하면 날짜별 풀이 수를 볼 수 있어요.</p>

    <section class="card" aria-label="알고리즘 풀이 활동">
      <div class="chart-scroll">
        <div id="chart" aria-label="최근 53주 풀이 기록"></div>
      </div>
      <div class="legend" aria-label="풀이 수 범례">
        <span>Less</span>
        <span class="legend-cell" data-level="0"></span><span class="legend-cell" data-level="1"></span>
        <span class="legend-cell" data-level="2"></span><span class="legend-cell" data-level="3"></span>
        <span class="legend-cell" data-level="4"></span>
        <span>More</span>
      </div>
      <div class="stats">
        <div class="stat"><div class="stat-label">Current Streak</div><div class="stat-value" id="current">–</div></div>
        <div class="stat"><div class="stat-label">Longest Streak</div><div class="stat-value" id="longest">–</div></div>
        <div class="stat"><div class="stat-label">Total Solved</div><div class="stat-value" id="total">–</div></div>
      </div>
    </section>
  </main>

  <div id="tooltip" role="tooltip" hidden></div>

  <script>
    const chart = document.querySelector('#chart');
    const tooltip = document.querySelector('#tooltip');
    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const dateFormatter = new Intl.DateTimeFormat('ko-KR', {
      year: 'numeric', month: 'long', day: 'numeric', weekday: 'short', timeZone: 'UTC'
    });

    function tooltipText(day) {
      const date = dateFormatter.format(new Date(`${day.date}T00:00:00Z`));
      return day.count ? `${date} · ${day.count}문제 풀이` : `${date} · 풀이 없음`;
    }

    function showTooltip(element, day) {
      const rect = element.getBoundingClientRect();
      tooltip.textContent = tooltipText(day);
      tooltip.hidden = false;
      tooltip.style.left = `${Math.min(Math.max(rect.left + rect.width / 2, 76), window.innerWidth - 76)}px`;
      tooltip.style.top = `${rect.top}px`;
    }

    function hideTooltip() {
      tooltip.hidden = true;
    }

    function addLabel(text, column, row, className) {
      const label = document.createElement('span');
      label.className = className;
      label.textContent = text;
      label.style.gridColumn = column;
      label.style.gridRow = row;
      chart.append(label);
    }

    function render(data) {
      addLabel('Mon', 1, 3, 'weekday');
      addLabel('Wed', 1, 5, 'weekday');
      addLabel('Fri', 1, 7, 'weekday');

      let previousMonth = -1;
      let previousLabelColumn = -10;

      data.days.forEach((day, index) => {
        const parsed = new Date(`${day.date}T00:00:00Z`);
        const week = Math.floor(index / 7);
        const weekday = index % 7;
        const column = week + 2;

        if (parsed.getUTCDate() === 1 && parsed.getUTCMonth() !== previousMonth) {
          if (column - previousLabelColumn >= 3) {
            addLabel(monthNames[parsed.getUTCMonth()], column, 1, 'month');
            previousLabelColumn = column;
          }
          previousMonth = parsed.getUTCMonth();
        }

        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = `day${day.future ? ' future' : ''}`;
        cell.dataset.level = Math.min(day.count, 4);
        cell.style.gridColumn = column;
        cell.style.gridRow = weekday + 2;
        cell.setAttribute('aria-label', tooltipText(day));
        cell.addEventListener('pointerenter', () => showTooltip(cell, day));
        cell.addEventListener('pointerleave', hideTooltip);
        cell.addEventListener('focus', () => showTooltip(cell, day));
        cell.addEventListener('blur', hideTooltip);
        cell.addEventListener('click', (event) => {
          event.stopPropagation();
          showTooltip(cell, day);
        });
        chart.append(cell);
      });

      document.querySelector('#current').textContent = `${data.currentStreak} days`;
      document.querySelector('#longest').textContent = `${data.longestStreak} days`;
      document.querySelector('#total').textContent = data.totalSolved;
    }

    document.addEventListener('click', hideTooltip);
    window.addEventListener('scroll', hideTooltip, true);
    window.addEventListener('resize', hideTooltip);

    fetch('./activity.json')
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(render)
      .catch(() => {
        chart.innerHTML = '<p class="error">활동 기록을 불러오지 못했습니다.</p>';
      });
  </script>
</body>
</html>
